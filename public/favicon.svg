<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Main Icon Gradient (Cyan to Indigo) -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Accent Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Box -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />

  <!-- Math & Motion Graphic: Dynamic Square Root Chevron -->
  <g filter="url(#glow)">
    <!-- Main Radical/Speed Line -->
    <path d="M 13 35 L 20 35 L 27 47 L 41 20 L 51 20" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Math Accents -->
    <!-- Plus Operator (Top Right) -->
    <path d="M 44 29 H 50 M 47 26 V 32" 
          stroke="#38BDF8" 
          stroke-width="2.5" 
          stroke-linecap="round" />

    <!-- Multiply / X (Bottom Left) -->
    <path d="M 15 44 L 21 50 M 21 44 L 15 50" 
          stroke="#8B5CF6" 
          stroke-width="2.2" 
          stroke-linecap="round" />

    <!-- Equals Sign / Motion Trails (Bottom Right) -->
    <path d="M 37 44 H 49 M 37 49 H 49" 
          stroke="#F43F5E" 
          stroke-width="2.5" 
          stroke-linecap="round" />
  </g>
</svg>
